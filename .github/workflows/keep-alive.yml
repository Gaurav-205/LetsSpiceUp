name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render free tier spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL || 'https://letsspiceup.onrender.com' }}"
          echo "Pinging: $BACKEND_URL/health"
          
          # Get both status code and response body for debugging
          status_code=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$BACKEND_URL/health" || echo "000")
          response_body=$(cat /tmp/health_response.json 2>/dev/null || echo "")
          
          echo "Status Code: $status_code"
          if [ -n "$response_body" ]; then
            echo "Response: $response_body"
          fi
          
          # Accept 200 as healthy (server is running)
          if [ "$status_code" = "200" ]; then
            echo "✅ Backend is healthy (Status: $status_code)"
            exit 0
          else
            echo "⚠️ Backend returned status: $status_code"
            echo "This may indicate the server is down or experiencing issues."
            exit 1
          fi

